name: vns-manuscript
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # Arrays, statistics, signal processing, and manuscript figures
  - numpy=1.26
  - scipy=1.15
  - pandas=2.3
  - matplotlib=3.10
  - statsmodels=0.14
  - scikit-learn=1.7
  - pip:
      # EEG preprocessing and SE/DFA/MSE feature extraction
      - mne==1.9.0
      - autoreject==0.4.3
      - mne-icalabel==0.7.0
      - EntropyHub==2.0
      - fathon==1.3.3.post1
      # Model fitting, simulation, and fixed-point analysis.
      # The full 250-point refit requires an NVIDIA GPU and CUDA 12.
      - jax[cuda12]==0.6.2
      - scikit-optimize==0.10.2
